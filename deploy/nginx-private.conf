server {
    listen 8080 ssl;
    listen [::]:8080 ssl;
    server_name 129.211.50.155;

    ssl_certificate /etc/letsencrypt-lifediary/live/129.211.50.155/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-lifediary/live/129.211.50.155/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lifediary/current;
    index index.html;
    access_log /var/log/nginx/lifediary.access.log;
    error_log /var/log/nginx/lifediary.error.log;

    location ^~ /api/vault/ {
        client_max_body_size 16m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-LifeDiary-Client-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8787;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
