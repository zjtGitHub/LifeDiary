server {
    listen 8080;
    listen [::]:8080;
    server_name 129.211.50.155;

    root /var/www/lifediary/current;
    index index.html;

    access_log /var/log/nginx/lifediary.access.log;
    error_log /var/log/nginx/lifediary.error.log;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
